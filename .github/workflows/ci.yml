name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest -q

  validate:
    name: correctness gates (projects 01, 03 & 04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Statistical gates against closed forms and theoretical scaling laws.
      # Exits non-zero if any gate fails, so a broken simulator fails the build.
      - name: Run validation gates (project 01)
        working-directory: 01-rough-volatility-monte-carlo
        run: python scripts/validate.py

      # Same idea for the econometrics: simulated ADF critical values against
      # MacKinnon's published table, parameter recovery for GARCH and the HMM,
      # and an end-to-end look-ahead check. No market data needed.
      - name: Run validation gates (project 03)
        working-directory: 03-pairs-trading-regimes
        run: python scripts/validate.py

      # And for the factor model and the learners: an exactly-constructed
      # covariance spectrum, the Marchenko-Pastur law against a simulated null,
      # the ridge shrinkage identity, the binned split search against brute
      # force, a purging check that carries its own unpurged control, and a
      # size/power pair on the whole pipeline.
      - name: Run validation gates (project 04)
        working-directory: 04-ml-alpha-pca-factors
        run: python scripts/validate.py

  smoke:
    name: end-to-end smoke run (projects 02, 03 & 04, sample data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The full 28 MB dataset is not committed, so CI exercises the pipeline
      # against the committed 10-ticker sample. This catches import errors,
      # plotting regressions and schema drift without needing the download.
      # --outdir keeps the run from overwriting the committed reports, which
      # were generated from the full 619k-row panel.
      - name: Profile the committed sample (project 02)
        working-directory: 02-systematic-equity-backtest
        run: |
          python scripts/explore_data.py \
            --data data/sample_prices.csv \
            --outdir "${RUNNER_TEMP}/smoke-02"

      # Exercises the full pipeline: two-stage screen, walk-forward slicing,
      # regime fit and backtest. --quick skips the 12-cell robustness grid,
      # which is 12 more walk-forwards and adds nothing to a smoke test.
      - name: Screen pairs on the committed sample (project 03)
        working-directory: 03-pairs-trading-regimes
        run: |
          python scripts/screen_pairs.py \
            --data data/sample_prices.csv \
            --top-k 200 \
            --outdir "${RUNNER_TEMP}/smoke-03"

      - name: Fit regimes on the committed sample (project 03)
        working-directory: 03-pairs-trading-regimes
        run: |
          python scripts/fit_regimes.py \
            --data data/sample_prices.csv \
            --burn-in 400 \
            --outdir "${RUNNER_TEMP}/smoke-03"

      - name: Backtest on the committed sample (project 03)
        working-directory: 03-pairs-trading-regimes
        run: |
          python scripts/run_backtest.py \
            --data data/sample_prices.csv \
            --top-k 200 --burn-in 400 --quick \
            --outdir "${RUNNER_TEMP}/smoke-03"

      # Project 04's pipeline is the longest in the portfolio, so the smoke run
      # uses the 60-ticker sample, a shorter first training window and --quick,
      # which cuts the boosted ensemble and skips the 12-cell robustness grid.
      # It still exercises every stage: PCA, features, purged folds, all three
      # learners, portfolio construction and the factor attribution.
      - name: Fit the factor model on the committed sample (project 04)
        working-directory: 04-ml-alpha-pca-factors
        run: |
          python scripts/fit_factors.py \
            --data data/sample_prices.csv \
            --outdir "${RUNNER_TEMP}/smoke-04"

      - name: Score the features on the committed sample (project 04)
        working-directory: 04-ml-alpha-pca-factors
        run: |
          python scripts/explore_features.py \
            --data data/sample_prices.csv \
            --initial-train 400 \
            --outdir "${RUNNER_TEMP}/smoke-04"

      - name: Train and backtest on the committed sample (project 04)
        working-directory: 04-ml-alpha-pca-factors
        run: |
          python scripts/run_models.py \
            --data data/sample_prices.csv \
            --initial-train 400 --quick \
            --outdir "${RUNNER_TEMP}/smoke-04"

      - name: Confirm the committed reports were untouched
        run: git diff --exit-code --stat
